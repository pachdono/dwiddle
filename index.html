<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch when it is
         launched from the home screen, with the safe areas handled in CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installed app. iOS ignores an SVG apple-touch-icon and falls back to a
         screenshot of the page, so this one has to be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dwiddle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The browser chrome follows the theme rather than being fixed to one. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121215" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Turn your notes into questions, lessons and full length practice papers. Write in notebooks together, race friends, and prepare for the SAT, ACT, SSAT, IELTS and TOEFL. Free." />
    <link rel="canonical" href="https://dwiddle.vercel.app/" />

    <!-- What a link to this shows in a message or a post. Without these it
         previews as a bare URL with no image, which reads as broken. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dwiddle" />
    <meta property="og:url" content="https://dwiddle.vercel.app/" />
    <meta property="og:title" content="Dwiddle: turn your notes into the real exam" />
    <meta property="og:description" content="Questions, lessons and full timed papers from your own notes, plus notebooks you can write in together, live. Free." />
    <meta property="og:image" content="https://dwiddle.vercel.app/og.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dwiddle: turn your notes into the real exam" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dwiddle: turn your notes into the real exam" />
    <meta name="twitter:description" content="Questions, lessons and full timed papers from your own notes, plus notebooks you can write in together, live. Free." />
    <meta name="twitter:image" content="https://dwiddle.vercel.app/og.png?v=3" />

    <!-- What this actually is. A web application, described truthfully. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Dwiddle",
        "url": "https://dwiddle.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any modern browser",
        "description": "Turns your own notes into practice questions, lessons and full length timed practice papers, with notebooks you can share and write in together live, flashcard decks, and prep for the SAT, ACT, SSAT, IELTS and TOEFL.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
      }
    </script>
    <title>Dwiddle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
