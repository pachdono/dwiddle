<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#f8dc6e" />
    <meta name="description" content="Turn your notes into questions, and sit full length practice papers for the SAT, ACT, SSAT, IELTS and TOEFL." />
    <link rel="canonical" href="https://dwiddle.vercel.app/" />

    <!-- What a link to this shows in a message or a post. Without these it
         previews as a bare URL with no image, which reads as broken. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dwiddle" />
    <meta property="og:url" content="https://dwiddle.vercel.app/" />
    <meta property="og:title" content="Dwiddle: turn your notes into the real exam" />
    <meta property="og:description" content="Paste your notes and get questions, explanations and full length timed papers. SAT, ACT, SSAT, IELTS and TOEFL." />
    <meta property="og:image" content="https://dwiddle.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dwiddle: turn your notes into the real exam" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dwiddle: turn your notes into the real exam" />
    <meta name="twitter:description" content="Paste your notes and get questions, explanations and full length timed papers. SAT, ACT, SSAT, IELTS and TOEFL." />
    <meta name="twitter:image" content="https://dwiddle.vercel.app/og.png" />

    <!-- What this actually is. A web application, described truthfully. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Dwiddle",
        "url": "https://dwiddle.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any modern browser",
        "description": "Turns your own notes into practice questions with explanations, and runs full length timed practice papers for the SAT, ACT, SSAT, IELTS and TOEFL.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
      }
    </script>
    <title>Dwiddle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
